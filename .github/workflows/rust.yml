name: Rust
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Rust
        uses: actions/checkout@v5
      
      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra fontconfig
          fc-cache -fv
      
      # --workspace covers demo-app and simple-example, which the default
      # members alone leave out. --all-features enables lsp-process and
      # two-face, whose code and tests are otherwise never compiled here.
      - name: Build
        run: cargo build --verbose --workspace --all-features

      - name: Clippy
        run: cargo clippy --verbose --workspace --all-targets --all-features

      - name: Test
        run: cargo test --verbose --workspace --all-features
      
      - name: Format Check
        run: cargo fmt -- --check

  # Separate job so a new advisory is reported on its own rather than hidden
  # behind a build failure, and so it runs in parallel with `build` instead of
  # adding to its wall time.
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Installed from source rather than through a third-party action: the
      # dependency surface of the step that checks dependencies is worth
      # keeping at zero.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Advisories this project cannot act on are listed, with the reason each
      # is unreachable, in `.cargo/audit.toml`. `cargo audit` reads that file
      # itself, so the rationale lives next to the exception instead of in a
      # command line here. Anything not listed there fails the build.
      #
      # `--deny warnings` is what makes that last sentence true. Bare
      # `cargo audit` exits non-zero only for the `vulnerability` class; an
      # `unmaintained`, `unsound` or `yanked` advisory is printed and the job
      # still passes, so one could arrive and go unnoticed -- which is exactly
      # what happened to RUSTSEC-2026-0253 between this job being added and
      # the 2026-08-30 review.
      - name: Audit
        run: cargo audit --deny warnings

  # Separate job for the same reasons as `audit`: a semver break is reported
  # on its own, in parallel with `build`.
  semver:
    name: Semver Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Installed from source, like cargo-audit, to keep third-party actions
      # out of the checks.
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked

      # Compares the public API against the last version published on
      # crates.io. With the version unchanged, it assumes a minor release, so
      # an API break is reported as needing a major bump.
      #
      # Informational only: pull requests never bump `version` -- the
      # maintainer does, at release time -- so a break is expected to show up
      # here before the bump exists. Failing the job would block such a PR for
      # something its author cannot fix. The step is allowed to fail and the
      # next one turns the result into a warning on the run instead. The hard
      # gate is `publish_release.sh`, which runs the same check against the
      # bumped version before anything is published.
      # --all-features covers the API behind `lsp-process`.
      - name: Check semver
        id: semver
        continue-on-error: true
        run: cargo semver-checks check-release -p iced-code-editor --all-features

      - name: Report semver break
        if: steps.semver.outcome == 'failure'
        run: |
          echo "::warning title=Breaking API change::This change breaks the public API of iced-code-editor. The next release needs a major version bump (see the Check semver step log)."
          {
            echo "### Breaking API change"
            echo ""
            echo "\`cargo semver-checks\` found changes that require a major version bump."
            echo "See the **Check semver** step log for the failing lints."
          } >> "$GITHUB_STEP_SUMMARY"
