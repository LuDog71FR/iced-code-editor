name: Rust
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Rust
        uses: actions/checkout@v4
      
      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra fontconfig
          fc-cache -fv
      
      # --workspace covers demo-app and simple-example, which the default
      # members alone leave out. --all-features enables lsp-process and
      # two-face, whose code and tests are otherwise never compiled here.
      - name: Build
        run: cargo build --verbose --workspace --all-features

      - name: Clippy
        run: cargo clippy --verbose --workspace --all-targets --all-features

      - name: Test
        run: cargo test --verbose --workspace --all-features
      
      - name: Format Check
        run: cargo fmt -- --check

  # Separate job so a new advisory is reported on its own rather than hidden
  # behind a build failure, and so it runs in parallel with `build` instead of
  # adding to its wall time.
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installed from source rather than through a third-party action: the
      # dependency surface of the step that checks dependencies is worth
      # keeping at zero.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Advisories this project cannot act on are listed, with the reason each
      # is unreachable, in `.cargo/audit.toml`. `cargo audit` reads that file
      # itself, so the rationale lives next to the exception instead of in a
      # command line here. Anything not listed there fails the build.
      #
      # `--deny warnings` is what makes that last sentence true. Bare
      # `cargo audit` exits non-zero only for the `vulnerability` class; an
      # `unmaintained`, `unsound` or `yanked` advisory is printed and the job
      # still passes, so one could arrive and go unnoticed -- which is exactly
      # what happened to RUSTSEC-2026-0253 between this job being added and
      # the 2026-08-30 review.
      - name: Audit
        run: cargo audit --deny warnings
